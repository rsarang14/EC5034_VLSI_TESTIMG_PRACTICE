
DefaultsSpecification(user) {
}
DftSpecification(dtmf_recvr_core,rtl1) +{
  IjtagNetwork +{
    HostScanInterface(ijtag) {
      Sib(sri) {
        Attributes {
          tessent_dft_function : scan_resource_instrument_host;
        }
        Sib(sri_ctrl) {
          Tdr(sri_ctrl) {
            Attributes {
              tessent_dft_function : scan_resource_instrument_dft_control;
            }
          }
        }
      }
      Sib(sti) {
        Attributes {
          tessent_dft_function : scan_tested_instrument_host;
        }
        Sib(mbist) {
        }
      }
    }
  }
  MemoryBist +{
    ijtag_host_interface : Sib(mbist);
    Controller(c1) {
      clock_domain_label : m_ram_clk;
      Step {
        MemoryInterface(m1) {
          instance_name : RAM_128x16_TEST_INST/RAM_128x16_INST;
        }
      }
    }
    Controller(c2) +{
      clock_domain_label : m_dsram_clk;
      Step +{
        MemoryInterface(m1) {
          instance_name : RAM_256x16_TEST_INST_1/RAM_256x16_INST;
        }
      }
    }
    Controller(c3) +{
      clock_domain_label : m_clk;
      Step +{
        MemoryInterface(m1) {
          instance_name : ROM_512x16_0_INST;
          rom_content_file : romcontent.cfg;
        }
      }
    }
    Controller(c4) +{
      clock_domain_label : m_dsram_clk;
      Step +{
        MemoryInterface(m1) {
          instance_name : RAM_256x16_TEST_INST_2/RAM_256x16_INST;
        }
      }
      Step +{
        algorithm : SMarch;
        MemoryInterface(m2) {
          instance_name : RAM_256x16_TEST_INST_3/RAM_256x16_INST;
        }
      }
    }
  }
}
PatternsSpecification(dtmf_recvr_core,rtl1,signoff) {
  Patterns(ICLNetwork) {
    ICLNetworkVerify(dtmf_recvr_core) {
    }
  }
  Patterns(MemoryBist_P1) {
    DftControlSettings {
      all_test : 1;
    }
    ClockPeriods {
      refclk : 8.0ns;
    }
    TestStep(go_nogo) {
      MemoryBist {
        run_mode : run_time_prog;
        reduced_address_count : off;
        Controller(RAM_128x16_TEST_INST_dtmf_recvr_core_rtl1_tessent_mbist_c1_controller_inst) {
          DiagnosisOptions {
            compare_go : on;
            compare_go_id : on;
          }
        }
        Controller(RAM_256x16_TEST_INST_1_dtmf_recvr_core_rtl1_tessent_mbist_c2_controller_inst) {
          DiagnosisOptions {
            compare_go : on;
            compare_go_id : on;
          }
        }
        Controller(dtmf_recvr_core_rtl1_tessent_mbist_c3_controller_inst) {
          DiagnosisOptions {
            compare_go : on;
            compare_misr : on;
          }
          MemoryInterface(m1) {
            expected_rom_signature : auto;
          }
        }
        Controller(dtmf_recvr_core_rtl1_tessent_mbist_c4_controller_inst) {
          DiagnosisOptions {
            compare_go : on;
            compare_go_id : on;
          }
        }
      }
    }
  }
  Patterns(MemoryBist_ParallelRetentionTest_P1) {
    DftControlSettings {
      all_test : 1;
    }
    ClockPeriods {
      refclk : 8.0ns;
    }
    TestStep(ParallelRetentionTest) {
      MemoryBist {
        run_mode : hw_default;
        parallel_retention_time : 0;
        reduced_address_count : on;
        Controller(RAM_128x16_TEST_INST_dtmf_recvr_core_rtl1_tessent_mbist_c1_controller_inst) {
          parallel_retention_group : 1;
          DiagnosisOptions {
            compare_go_id : on;
          }
        }
        Controller(RAM_256x16_TEST_INST_1_dtmf_recvr_core_rtl1_tessent_mbist_c2_controller_inst) {
          parallel_retention_group : 1;
          DiagnosisOptions {
            compare_go_id : on;
          }
        }
        Controller(dtmf_recvr_core_rtl1_tessent_mbist_c4_controller_inst) {
          parallel_retention_group : 1;
          DiagnosisOptions {
            compare_go_id : on;
          }
        }
      }
    }
  }
}
